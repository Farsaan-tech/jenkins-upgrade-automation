name: Validate infrastructure and automation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: terraform
      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: terraform
      - name: Terraform validate
        run: terraform validate
        working-directory: terraform
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible and YAML parser
        run: python -m pip install ansible-core==2.17.7 yamllint
      - name: YAML lint
        run: yamllint -d relaxed ansible
      - name: Playbook syntax checks
        run: |
          ansible-playbook -i ansible/inventory/example.ini ansible/playbooks/install-pinned.yml --syntax-check
          ansible-playbook -i ansible/inventory/example.ini ansible/playbooks/backup.yml --syntax-check
          ansible-playbook -i ansible/inventory/example.ini ansible/playbooks/upgrade.yml --syntax-check
          ansible-playbook -i ansible/inventory/example.ini ansible/playbooks/verify.yml --syntax-check
