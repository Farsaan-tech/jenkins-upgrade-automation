
  ansible:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible and YAML parser
        run: python -m pip install ansible-core==2.17.7 yamllint

      - name: Install Ansible collections
        run: ansible-galaxy collection install community.general

      - name: YAML lint
        run: yamllint -d relaxed .

      - name: Playbook syntax checks
        run: |
          ansible-playbook -i inventory/example.ini playbooks/install-pinned.yml --syntax-check
          ansible-playbook -i inventory/example.ini playbooks/backup.yml --syntax-check
          ansible-playbook -i inventory/example.ini playbooks/upgrade.yml --syntax-check
          ansible-playbook -i inventory/example.ini playbooks/verify.yml --syntax-check
